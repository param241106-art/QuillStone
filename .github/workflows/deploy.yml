name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Reads the Pages settings: base_path is "/QuillStone" on the github.io
      # address and "" once a custom domain (quillstones.com) is set, so the
      # build follows whichever address the site is served from.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # canonical URLs, sitemap.xml and robots.txt. Set the VITE_SITE_URL
          # repository variable if the site moves to another address.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://quillstones.com' }}
          # public build-time settings, set as repository variables (see .env.example)
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_FORM_ACCESS_KEY: ${{ vars.VITE_FORM_ACCESS_KEY }}
          VITE_ANALYTICS_ID: ${{ vars.VITE_ANALYTICS_ID }}
          VITE_ANALYTICS_SRC: ${{ vars.VITE_ANALYTICS_SRC }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
