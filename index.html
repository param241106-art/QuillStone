<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Links from before the move off the hash router (/#/what-we-do?scroll=x)
      // go straight to the page's real address, before anything renders.
      (function () {
        var h = location.hash;
        if (h.indexOf('#/') === 0) location.replace('%BASE_URL%' + h.slice(2));
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- font and page-code preloads, title, description, canonical, Open Graph
         and JSON-LD: scripts/prerender.mjs and src/seo/meta.ts. The fonts are
         self-hosted (src/fonts.css). -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
